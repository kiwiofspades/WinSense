[package]
name = "winsense"
version = "0.17.2"
edition = "2024"
description = "A Windows tray program for the PS5 DualSense controller"
license = "MIT"
repository = "https://github.com/kiwiofspades/WinSense"

[dependencies]
hidapi = "2.6.7"
# Already in the tree through hidapi; used for the test screen (src/ui.rs).
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Devices_Bluetooth", "Win32_System_Console", "Win32_Graphics_Dwm", "Win32_Graphics_GdiPlus", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }
# src/desk.rs lists notifications through WinRT (UI_Notifications_Management).
# Voice commands (src/voice.rs): SAPI, Media Foundation's Opus decoder and the shell's app list are COM, which windows-sys does not carry.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "UI_Notifications_Management"] }
